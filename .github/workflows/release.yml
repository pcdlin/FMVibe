# Builds a release whenever a version tag (v0.1, v0.14.1, v0.18-beta.1, ...) is pushed: the plugins, CLAP and VST3, built and tested
# on Windows and run through clap-validator and Steinberg's VST3 validator, go into a GitHub release as two zips, one
# per format with the user manual; built and tested on Linux (build.sh, Steinberg's validator among its tests), they
# go in beside them as two tarballs; and the browser demo (web/, see AGENTS.md) goes on GitHub Pages with the manual
# beside it. Nothing is published unless all three build.
# Needs Pages set to deploy from GitHub Actions, and the github-pages environment to allow v* tags (see "Releasing" in
# AGENTS.md). Run by hand on a branch (Actions > Release > Run workflow), it builds, tests and packs everything as a
# dry run, keeping the packages as the run's artifacts, and publishes nothing. A tag below the newest version (a patch
# release of an older one, v0.14.1 after v0.17) gets its release, not marked Latest, and leaves GitHub Pages alone. A
# tag with a label after a dash (v0.18-beta.1, from FMVIBE_PRERELEASE in CMakeLists.txt) is published as a
# pre-release, never Latest, and leaves GitHub Pages alone too.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One release at a time; a newer tag waits for the one under way instead of cutting it off.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plugin:
    # The image with Visual Studio 2026, which the README asks for.
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The version is set once, in project() in CMakeLists.txt, with a pre-release's label in FMVIBE_PRERELEASE;
      # the tag has to name the same one.
      - name: Check the tag against the version
        if: github.ref_type == 'tag'
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern '^project\(FMVibe VERSION ([0-9.]+)'
          if (-not $match) { throw 'No version found in project() in CMakeLists.txt.' }
          $version = $match.Matches[0].Groups[1].Value
          $label = Select-String -Path CMakeLists.txt -Pattern '^set\(FMVIBE_PRERELEASE "([^"]*)"\)'
          if (-not $label) { throw 'No set(FMVIBE_PRERELEASE "...") found in CMakeLists.txt.' }
          $label = $label.Matches[0].Groups[1].Value
          if ($label) { $version = "$version-$label" }
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME doesn't match the version $version in CMakeLists.txt (expected v$version)."
          }

      - name: Build, test and validate
        run: .\build.ps1 -Validate

      # One zip per format, so a download holds only the plugin a DAW takes. The MIT licenses of FMVibe and of the
      # SDK whose code is compiled in go with every copy, and so does the user manual: one HTML file that opens
      # offline.
      - name: Package
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '/', '-'

          python tools\manual.py docs\manual.md dist\FMVibe-Manual.html
          if ($LASTEXITCODE -ne 0) { throw 'The user manual did not build.' }

          New-Item -ItemType Directory dist\clap | Out-Null
          Copy-Item build\release\FMVibe.clap, LICENSE, dist\FMVibe-Manual.html dist\clap
          Copy-Item build\release\_deps\clap-src\LICENSE dist\clap\LICENSE-CLAP
          Compress-Archive dist\clap\* "FMVibe-$tag-windows-x64-clap.zip"

          New-Item -ItemType Directory dist\vst3 | Out-Null
          Copy-Item -Recurse build\release\FMVibe.vst3 dist\vst3
          Copy-Item LICENSE, dist\FMVibe-Manual.html dist\vst3
          Copy-Item build\release\_deps\vst3sdk\pluginterfaces\LICENSE.txt dist\vst3\LICENSE-VST3
          Compress-Archive dist\vst3\* "FMVibe-$tag-windows-x64-vst3.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-windows
          path: FMVibe-*.zip
          if-no-files-found: error

      # The editor's snapshots, to see what a failing UI check rendered.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-shots
          path: build/release/ui-shots
          if-no-files-found: ignore

  plugin-linux:
    # Ubuntu 24.04's GCC 13 is the oldest compiler the Linux build takes, so the plugins need a glibc about as new as
    # its (the Package step prints the newest symbol they take), and Cairo, X11 and fontconfig, which desktops have.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Inter is the font the editor draws in on Linux, so the snapshots come out as on a developer's machine. Xvfb is
      # the X server the test host opens the editor on, which it skips without a display.
      - name: Install the build's packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build g++ pkg-config libcairo2-dev libx11-dev fonts-inter xvfb

      # build.sh fetches the SDKs, builds both plugins and runs every Linux test: the quality test, the UI snapshots,
      # the manual, the test host (with the editor in a window, on Xvfb) and Steinberg's validator.
      - name: Build and test
        run: xvfb-run -a ./build.sh

      # What the plugins ask of the system they load into: the newest glibc symbol, for the log, and no libstdc++ or
      # libgcc_s, which they carry themselves (an older distribution's wouldn't do).
      - name: Check the plugins' dependencies
        run: |
          for plugin in build/linux/FMVibe.clap build/linux/FMVibe.vst3/Contents/x86_64-linux/FMVibe.so; do
            echo "$plugin: newest glibc symbol $(objdump -T "$plugin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
            ldd "$plugin"
            if ldd "$plugin" | grep -E 'libstdc\+\+|libgcc_s'; then
              echo "$plugin links the C++ runtime dynamically" >&2
              exit 1
            fi
          done

      # One tarball per format, holding a folder of the tarball's name, so it unpacks in one place: what goes into
      # ~/.clap or ~/.vst3, FMVibe's and the SDK's licenses and the user manual.
      - name: Package
        run: |
          tag=${GITHUB_REF_NAME//\//-}
          clap=$(ls -d build/deps/clap-*)
          clapdir=FMVibe-$tag-linux-x64-clap
          vst3dir=FMVibe-$tag-linux-x64-vst3

          mkdir -p "dist/$clapdir" "dist/$vst3dir"
          python3 tools/manual.py docs/manual.md dist/FMVibe-Manual.html

          cp build/linux/FMVibe.clap LICENSE dist/FMVibe-Manual.html "dist/$clapdir/"
          cp "$clap/LICENSE" "dist/$clapdir/LICENSE-CLAP"
          tar -czf "$clapdir.tar.gz" --owner=0 --group=0 --numeric-owner -C dist "$clapdir"

          cp -r build/linux/FMVibe.vst3 LICENSE dist/FMVibe-Manual.html "dist/$vst3dir/"
          cp build/deps/vst3sdk/pluginterfaces/LICENSE.txt "dist/$vst3dir/LICENSE-VST3"
          tar -czf "$vst3dir.tar.gz" --owner=0 --group=0 --numeric-owner -C dist "$vst3dir"

          tar -tzvf "$clapdir.tar.gz"
          tar -tzvf "$vst3dir.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-linux
          path: FMVibe-*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-shots-linux
          path: build/linux/ui-shots
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # build-web.ps1 pins the Emscripten version; the demo is built with the same one here.
      - name: Emscripten version
        id: emsdk
        run: |
          version=$(sed -n "s/^\$EmsdkVersion = '\([^']*\)'.*/\1/p" build-web.ps1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Emscripten
        id: cache
        uses: actions/cache@v6
        with:
          path: build/emsdk
          key: emsdk-${{ runner.os }}-${{ steps.emsdk.outputs.version }}

      - name: Install Emscripten
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.emsdk.outputs.version }}
        run: |
          git clone --quiet https://github.com/emscripten-core/emsdk build/emsdk
          git -C build/emsdk -c advice.detachedHead=false checkout --quiet "$VERSION"
          build/emsdk/emsdk install "$VERSION"
          build/emsdk/emsdk activate "$VERSION"

      - name: Install Ninja
        run: command -v ninja || (sudo apt-get update -q && sudo apt-get install -y -q ninja-build)

      - name: Build
        run: |
          source build/emsdk/emsdk_env.sh
          cmake --preset web
          cmake --build --preset web

      # The user manual beside the demo, at https://pcdlin.github.io/FMVibe/manual.html, which the README links to.
      # The page doesn't load it, so it stays out of version.txt's hash.
      - name: Manual
        run: python3 tools/manual.py docs/manual.md build/web/site/manual.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web/site

  # What the tag is among the repository's version tags: a pre-release (a label after a dash), the newest release
  # (only then is it Latest and its demo and manual the ones on GitHub Pages), and the release before it, below its
  # version, which its notes start from (so a release after its betas lists everything since the release before).
  tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      newest: ${{ steps.check.outputs.newest }}
      previous: ${{ steps.check.outputs.previous }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          base=${tag%%-*}
          if [ "$base" != "$tag" ]; then prerelease=true; else prerelease=false; fi
          releases=$( (gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name'; echo "$base") |
            grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -uV || true)
          newest=false
          if [ $prerelease = false ] && [ "$(echo "$releases" | tail -1)" = "$tag" ]; then newest=true; fi
          previous=$(echo "$releases" | grep -B1 -x -F "$base" | head -1 || true)
          if [ "$previous" = "$base" ]; then previous=; fi
          echo "pre-release: $prerelease, newest release: $newest, previous release: ${previous:-none}"
          { echo "prerelease=$prerelease"; echo "newest=$newest"; echo "previous=$previous"; } >> "$GITHUB_OUTPUT"

  release:
    needs: [plugin, plugin-linux, web, tag]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: plugin-*
          merge-multiple: true

      # The notes list the pull requests and commits since the release before; they can be edited on GitHub
      # afterwards. Only the newest release is marked Latest, so a patch release of an older one or a pre-release
      # doesn't take that from it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
          LATEST: ${{ needs.tag.outputs.newest }}
          PREVIOUS: ${{ needs.tag.outputs.previous }}
        run: |
          args=(--verify-tag --generate-notes --latest="$LATEST")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$GITHUB_REF_NAME" FMVibe-*.zip FMVibe-*.tar.gz --repo "$GITHUB_REPOSITORY" "${args[@]}"

  # The demo and the manual online are the newest release's: a patch release of an older one or a pre-release doesn't
  # replace them.
  pages:
    needs: [plugin, plugin-linux, web, tag]
    if: github.ref_type == 'tag' && needs.tag.outputs.newest == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
