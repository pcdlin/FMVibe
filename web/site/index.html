<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FMVibe browser demo</title>
  <meta name="description" content="FMVibe, a six-operator FM synthesizer, running in the browser: the plugin's own engine and editor, compiled to WebAssembly.">
  <style>html.loading body { visibility: hidden; }</style>
  <script>
    // GitHub Pages lets a browser keep each file for 10 minutes, each on a timer of its own, and the page's files
    // only work with those of their own build. So the build writes a hash of them into version.txt, fetched here
    // past the cache, and every file is asked for with it: a new build is new URLs throughout. main.js reads it
    // off its own URL. Without version.txt (an old build, a server without it) the files load as they are.
    (() => {
      const root = document.documentElement;
      const show = () => root.classList.remove('loading');
      root.classList.add('loading'); // until the stylesheet is in
      fetch('version.txt', {cache: 'no-store'})
        .then((r) => (r.ok ? r.text() : ''))
        .catch(() => '')
        .then((text) => {
          const version = text.trim();
          const query = version ? `?v=${encodeURIComponent(version)}` : '';
          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = `style.css${query}`;
          css.onload = css.onerror = show;
          document.head.append(css);
          return import(`./main.js${query}`);
        })
        .catch((error) => {
          show();
          throw error;
        });
    })();
  </script>
</head>
<body>
  <main id="stage">
    <div id="frame">
      <canvas id="editor" tabindex="0" aria-label="FMVibe editor"></canvas>
      <button id="sound" type="button"><span class="banner">Click here or press a key to enable</span></button>
    </div>
  </main>
  <footer>
    <div id="failed" class="banner failed" hidden></div>
    <p id="hint">
      <span>Play using your keyboard:</span>
      <span class="piano">
        <kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>E</kbd><kbd>D</kbd><kbd>F</kbd><kbd>T</kbd><kbd>G</kbd><kbd>Y</kbd><kbd>H</kbd><kbd>U</kbd><kbd>J</kbd><kbd>K</kbd>
      </span>
      <span><kbd>Z</kbd> and <kbd>X</kbd> shift the octave (<span id="octave">C4</span>), <kbd>C</kbd> and <kbd>V</kbd> the
        velocity (<span id="velocity">100</span>), or click the on-screen keys.</span>
    </p>
    <p id="source">
      <a href="https://github.com/pcdlin/FMVibe">FMVibe on GitHub</a> ·
      <a href="LICENSE.txt">License</a> ·
      <a href="THIRD-PARTY-NOTICES.txt">Third-party notices</a>
    </p>
  </footer>
  <div id="menu" role="menu" hidden></div>
  <div id="toast" role="status"></div>
</body>
</html>
